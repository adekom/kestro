# Firebase App Hosting configuration. See docs/deployment.md.
runConfig:
  minInstances: 0
  maxInstances: 4
  memoryMiB: 1024

env:
  # Public Firebase web config (safe to expose; set real values per deployment
  # in the App Hosting console or an apphosting.<env>.yaml override).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  # Stable public origin used in PDF photo links, e.g. https://reports.example.org
  - variable: KESTRO_PUBLIC_BASE_URL
    value: REPLACE_ME
    availability: [RUNTIME]
  # One-time first-administrator bootstrap secret (Cloud Secret Manager).
  - variable: KESTRO_BOOTSTRAP_SECRET
    secret: kestro-bootstrap-secret
    availability: [RUNTIME]
